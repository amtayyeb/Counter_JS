<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <script src="app.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
             display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 200px;
            background-color: rgb(207, 214, 214);
            border-radius: 30%;
            flex-direction: column;
        }
        .count{
            background-color: dodgerblue;
            color: rgb(6, 6, 53);
            padding: 12px;
            margin: 4px;
        }
        button{
            border-radius: 20%;
        }
    </style>
</head>

<body>
    <div class="container">
     <h1 id="count">0</h1>

        <div class="button">
        <button class="count" id="increaseBtn" type="button">Add</button>
        <button class="count" id="resetBtn" type="button">Reset</button>
        </div>
    </div>

</body>

</html>
