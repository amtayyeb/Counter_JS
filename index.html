<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="card">
        <h1 class="title">Counter</h1>

        <!-- The number. aria-live lets screen readers read changes -->
        <p id="count" class="count" aria-live="polite">0</p>

        <div class="buttons">
            <button id="decreaseBtn" class="btn" type="button" aria-label="Subtract">&minus;</button>
            <button id="resetBtn" class="btn btn-reset" type="button">Reset</button>
            <button id="increaseBtn" class="btn" type="button" aria-label="Add">+</button>
        </div>

        <label class="step">
            Step size
            <input id="stepInput" type="number" min="1" value="1">
        </label>

        <p class="hint">Keyboard: &uarr; add, &darr; subtract, R reset</p>
    </main>
</body>

</html>
